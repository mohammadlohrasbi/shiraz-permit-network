version: '3.7'

networks:
  shiraz-network:
    name: shiraz-network
    external: true

services:
  # ===================== Orderer =====================
  orderer.example.com:
    container_name: orderer.example.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=${NETWORK_TLS:-false}
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      # listener جدا برای خوشه Raft. فابریک اجازه می‌دهد ارتباط بین نودهای
      # Raft روی پورت و گواهی خودش باشد — همان چیزی که Raft را بدون TLS
      # سراسری هم ممکن می‌کند. وقتی OrdererType=solo است بی‌اثر می‌ماند.
      # خوشه Raft روی همان پورت و گواهی عمومی کار می‌کند.
      #
      # نسخه قبلی listener جدا داشت (۷۰۵۳) — که فابریک برای حالتی پیش‌بینی
      # کرده که TLS عمومی خاموش باشد و فقط خوشه رمزگذاری بخواهد. حالا که
      # TLS همه‌جا روشن است آن پیچیدگی لازم نیست، و در عمل نودها روی آن
      # پورت گواهی کلاینت نمی‌فرستادند: «tls: certificate required».
      #
      # با نبود ListenPort/ListenAddress/ServerCertificate/ServerPrivateKey،
      # این مقادیر از بخش TLS عمومی به ارث می‌رسند و پورت خوشه همان پورت
      # عمومی می‌شود — که باید با Port هر consenter در configtx بخواند.
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/client.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/client.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_BOOTSTRAPFILE=/etc/hyperledger/fabric/genesis.block
    volumes:
      - ./channel-artifacts/genesis.block:/etc/hyperledger/fabric/genesis.block:ro
      - ./crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp:ro
      - ./crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls:ro
      - ./crypto-config/ordererOrganizations/example.com/users/Admin@example.com/msp:/var/hyperledger/orderer/admin-msp:ro
      - orderer.example.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
    networks:
      - shiraz-network
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m

  peer0.org1.example.com:
    container_name: peer0.org1.example.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.example.com:7052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.com:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.example.com:7051
      - CORE_PEER_GOSSIP_USELEADERELECTION=true
      - CORE_PEER_GOSSIP_ORGLEADER=false
      - CORE_PEER_LOCALMSPID=org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=${NETWORK_TLS:-false}
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      # وقتی سرویس خوشه Raft روی همان پورت عمومی اوردرر باشد، فابریک
      # احراز هویت کلاینت را روی کل آن پورت لازم می‌کند. پس peer هنگام
      # اتصال به اوردرر باید گواهی خودش را بفرستد، وگرنه:
      #   tls: client didn't provide a certificate
      # همان جفت TLS خود peer استفاده می‌شود؛ گواهی جداگانه لازم نیست.
      - CORE_PEER_TLS_CLIENTCERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_CLIENTKEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=shiraz-network
      - CORE_CHAINCODE_BUILDER=hyperledger/fabric-ccenv:2.5
      - CORE_CHAINCODE_GOLANG_RUNTIME=hyperledger/fabric-baseos:2.5
      - FABRIC_CFG_PATH=/etc/hyperledger/percfg
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/etc/hyperledger/fabric/msp:rw
      - ./crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls:/etc/hyperledger/fabric/tls:ro
      - ./crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/etc/hyperledger/fabric/orderer-tls:ro
      - ./crypto-config/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp:/etc/hyperledger/fabric/admin-msp:ro
      - ./channel-artifacts:/etc/hyperledger/configtx:ro
      - peer0.org1.example.com:/var/hyperledger/production
      - ./core.yaml:/etc/hyperledger/percfg/core.yaml:ro
      - ../scripts/builders:/builders:ro
    ports:
      - "7051:7051"
    networks:
      - shiraz-network
    restart: unless-stopped
    mem_limit: 320m
    mem_reservation: 160m

