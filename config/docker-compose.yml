  # نود Raft — فقط با profile بالا می‌آید، پس همین فایل هم solo و هم
  # خوشه را پوشش می‌دهد:
  #   docker compose up -d                     → solo (فقط اوردرر اول)
  #   docker compose --profile raft  up -d     → ۳ نود
  #   docker compose --profile raft5 up -d     → ۵ نود
  orderer2.example.com:
    container_name: orderer2.example.com
    image: hyperledger/fabric-orderer:2.5
    profiles: ["raft", "raft5"]
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=8050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_BOOTSTRAPFILE=/var/hyperledger/orderer/genesis.block
      - ORDERER_GENERAL_TLS_ENABLED=${NETWORK_TLS:-false}
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      # خوشه Raft روی همان پورت و گواهی عمومی کار می‌کند.
      #
      # نسخه قبلی listener جدا داشت (۷۰۵۳) — که فابریک برای حالتی پیش‌بینی
      # کرده که TLS عمومی خاموش باشد و فقط خوشه رمزگذاری بخواهد. حالا که
      # TLS همه‌جا روشن است آن پیچیدگی لازم نیست، و در عمل نودها روی آن
      # پورت گواهی کلاینت نمی‌فرستادند: «tls: certificate required».
      #
      # با نبود ListenPort/ListenAddress/ServerCertificate/ServerPrivateKey،
      # این مقادیر از بخش TLS عمومی به ارث می‌رسند و پورت خوشه همان پورت
      # عمومی می‌شود — که باید با Port هر consenter در configtx بخواند.
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/client.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/client.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_CONSENSUS_WALDIR=/var/hyperledger/production/orderer/etcdraft/wal
      - ORDERER_CONSENSUS_SNAPDIR=/var/hyperledger/production/orderer/etcdraft/snapshot
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/genesis.block
      - ./crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls:/var/hyperledger/orderer/tls:ro
      - orderer2.example.com:/var/hyperledger/production/orderer
    ports:
      - "127.0.0.1:8050:8050"
    networks:
      - shiraz-network
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m

